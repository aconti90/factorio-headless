name: Build & publish

# Reusable build. Called by release-watch.yml when upstream ships a new version,
# and available manually for rebuilds (base-image CVE, entrypoint fix, ...).
on:
  workflow_call:
    inputs:
      version:
        description: Factorio version to build, e.g. 2.1.19
        required: true
        type: string
      channels:
        description: Comma-separated channel tags to apply, e.g. "stable" or "experimental,stable"
        required: true
        type: string
      platforms:
        description: Comma-separated buildx platforms, e.g. "linux/amd64,linux/arm64"
        required: true
        type: string
      sha256:
        description: JSON object mapping platform -> sha256 of the upstream tarball
        required: false
        type: string
        default: '{}'
  workflow_dispatch:
    inputs:
      version:
        description: Factorio version to build, e.g. 2.1.19
        required: true
        type: string
      channels:
        description: Comma-separated channel tags to apply
        required: true
        type: choice
        options: [stable, experimental, "experimental,stable"]
      platforms:
        description: Comma-separated buildx platforms
        required: false
        type: string
        default: linux/amd64,linux/arm64

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # ghcr.io image names must be lowercase; repository owners often are not.
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Only needed for the *final* stage on cross-builds. The download stage
      # pins itself to $BUILDPLATFORM, so the expensive part (fetch + unpack)
      # always runs natively — see docker/Dockerfile.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          CHANNELS: ${{ inputs.channels }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          minor="${VERSION%.*}"          # 2.1.19 -> 2.1
          major="${VERSION%%.*}"         # 2.1.19 -> 2

          tags="${IMAGE}:${VERSION}"

          is_stable=false
          IFS=',' read -ra channel_list <<< "${CHANNELS}"
          for channel in "${channel_list[@]}"; do
            channel="$(echo "${channel}" | tr -d '[:space:]')"
            [ -n "${channel}" ] || continue
            tags="${tags},${IMAGE}:${channel}"
            if [ "${channel}" = "stable" ]; then is_stable=true; fi
          done

          # Floating minor/major/latest tags only ever track the stable channel,
          # so an experimental release can never quietly become someone's :2.1.
          if [ "${is_stable}" = "true" ]; then
            tags="${tags},${IMAGE}:${minor},${IMAGE}:${major},${IMAGE}:latest"
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Tagging: ${tags}"

      - name: Resolve checksums
        id: sums
        env:
          SUMS: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          sums="${SUMS:-}"
          [ -n "${sums}" ] || sums='{}'
          # Emitted per-architecture so every platform in a multi-arch manifest
          # is verified against its own tarball, not just single-arch builds.
          {
            echo "amd64=$(jq -r '."linux/amd64" // ""' <<<"${sums}")"
            echo "arm64=$(jq -r '."linux/arm64" // ""' <<<"${sums}")"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            FACTORIO_VERSION=${{ inputs.version }}
            FACTORIO_SHA256_AMD64=${{ steps.sums.outputs.amd64 }}
            FACTORIO_SHA256_ARM64=${{ steps.sums.outputs.arm64 }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published \`${{ inputs.version }}\` (${{ inputs.channels }})"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Platforms | \`${{ inputs.platforms }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Tags | \`${{ steps.tags.outputs.tags }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
