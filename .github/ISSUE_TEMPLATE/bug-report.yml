name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      options:
        - stable
        - experimental
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: "arm64 is currently only published on the experimental channel — see the README's Tags section."
      options:
        - amd64
        - arm64
    validations:
      required: true
  - type: input
    id: image-tag
    attributes:
      label: Image tag
      description: The exact tag you're running, e.g. `2.0.77` or `stable`
      placeholder: "2.0.77"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker logs <container>`, if relevant
      render: shell
    validations:
      required: false
